<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Anatomy Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #0c0c10; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* Floating UI Toggle Button */
        #ui-toggle-btn {
            position: absolute; top: 14px; right: 14px; z-index: 50;
            background: rgba(28, 28, 38, 0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2); color: #fff;
            padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 6px;
        }

        /* Glassmorphic Studio Panel */
        #ui-panel {
            position: absolute; top: 14px; left: 14px; width: 340px; max-height: 92vh;
            background: rgba(18, 18, 24, 0.88); backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px;
            padding: 14px; overflow-y: auto; z-index: 20; box-shadow: 0 16px 40px rgba(0,0,0,0.6);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease;
        }
        #ui-panel.hidden { transform: translateX(-120%); opacity: 0; pointer-events: none; }

        @media (max-width: 768px) {
            #ui-panel {
                top: auto; bottom: 0; left: 0; width: 100%; max-height: 50vh;
                border-radius: 18px 18px 0 0; border-bottom: none;
            }
            #ui-panel.hidden { transform: translateY(110%); }
        }

        h2 { font-size: 14px; font-weight: 700; color: #fff; display: flex; align-items: center; justify-content: space-between; }
        .status-badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 500; }
        .status-badge.ok { background: #064e3b; color: #6ee7b7; }
        .status-badge.warn { background: #78350f; color: #fcd34d; }

        .tabs { display: flex; gap: 4px; margin: 10px 0; background: #14141c; padding: 3px; border-radius: 8px; }
        .tab { flex: 1; text-align: center; padding: 6px 0; font-size: 11px; border-radius: 6px; cursor: pointer; color: #8a8a9a; }
        .tab.active { background: #262638; color: #fff; font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #64748b; margin: 12px 0 6px; border-bottom: 1px solid #232330; padding-bottom: 3px; }
        .control-group { margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        
        label { font-size: 11px; color: #94a3b8; display: flex; justify-content: space-between; }
        select, input[type="range"], button {
            background: #1b1b26; color: #f8fafc; border: 1px solid #333346;
            border-radius: 6px; padding: 6px 8px; font-size: 12px; outline: none;
        }
        input[type="range"] { -webkit-appearance: none; height: 4px; background: #2d2d3f; border-radius: 2px; padding: 0; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #6366f1; cursor: pointer; }
        button { cursor: pointer; background: #252536; font-weight: 500; }
        button.primary { background: #4f46e5; border-color: #6366f1; }
        
        /* Diagnostic Rig Box */
        #rig-status-box {
            font-size: 11px; padding: 6px 10px; border-radius: 6px;
            background: #1a1a26; border: 1px solid #2d2d40; margin-bottom: 10px;
        }

        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 10, 14, 0.85); backdrop-filter: blur(8px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; color: #cbd5e1; font-size: 13px;
        }
        .spinner { width: 34px; height: 34px; border: 3px solid #272738; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <!-- Three.js + OrbitControls + GLTFLoader + JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <button id="ui-toggle-btn" onclick="toggleUI()">👁️ Hide UI</button>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-text">Loading Anatomy Models...</p>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h2>
            Anatomy Studio 3D
            <span id="zip-badge" class="status-badge warn">Checking ZIP...</span>
        </h2>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('tab-model')">Model</div>
            <div class="tab" onclick="switchTab('tab-pose')">Posing</div>
            <div class="tab" onclick="switchTab('tab-light')">Lighting</div>
            <div class="tab" onclick="switchTab('tab-file')">Data</div>
        </div>

        <!-- TAB 1: MODEL SELECTION -->
        <div id="tab-model" class="tab-content active">
            <div class="section-title">Anatomy Subject</div>
            <div class="control-group">
                <label>Ethnic Archetype (လူမျိုး):</label>
                <select id="sel-ethnic" onchange="onModelChange()">
                    <option value="asian" selected>Asian</option>
                    <option value="african">African</option>
                    <option value="caucasian">Caucasian</option>
                </select>
            </div>
            <div class="grid-2">
                <div class="control-group">
                    <label>Gender (ကျား/မ):</label>
                    <select id="sel-gender" onchange="onModelChange()">
                        <option value="male" selected>Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Age (အသက်အရွယ်):</label>
                    <select id="sel-age" onchange="onModelChange()">
                        <option value="adult" selected>Adult</option>
                        <option value="teen">Teen</option>
                        <option value="child">Child</option>
                        <option value="toddler">Toddler</option>
                        <option value="elderly">Elderly</option>
                    </select>
                </div>
            </div>

            <div class="section-title">Shading Mode (အလင်းအမှောင်)</div>
            <div class="control-group">
                <select id="sel-shading" onchange="applyShadingMode(this.value)">
                    <option value="clay" selected>Smooth Clay (ပလာစတာစတိုင်)</option>
                    <option value="planar">Planar / Asaro (Planes of Light)</option>
                    <option value="ecorche">Ecorché (ကြွက်သားလွှာစတိုင်)</option>
                    <option value="wireframe">Wireframe</option>
                    <option value="original">Original Mesh</option>
                </select>
            </div>

            <div class="section-title">Height Adjustment</div>
            <div class="control-group">
                <label>Height: <span id="val-height">100%</span></label>
                <input type="range" id="height-slider" min="70" max="130" value="100" oninput="adjustHeight(this.value)">
            </div>
        </div>

        <!-- TAB 2: POSING & BONES -->
        <div id="tab-pose" class="tab-content">
            <!-- Rig Diagnostic Display -->
            <div id="rig-status-box">Detecting Bones...</div>

            <div class="section-title">Pose Presets</div>
            <div class="control-group">
                <select id="sel-pose" onchange="applyPresetPose(this.value)">
                    <option value="neutral">Neutral A-Pose</option>
                    <option value="contrapposto" selected>Contrapposto (အလေးပေးရပ်ဟန်)</option>
                    <option value="sitting">Sitting (ထိုင်ဟန်)</option>
                    <option value="action">Dynamic Action</option>
                </select>
            </div>

            <div class="section-title">Joint Manipulation (FK)</div>
            <div class="control-group">
                <label>Select Joint:</label>
                <select id="sel-bone" onchange="loadBoneRotations()"></select>
            </div>
            <div class="control-group">
                <label>Rotate X: <span id="val-rx">0°</span></label>
                <input type="range" id="rot-x" min="-120" max="120" value="0" oninput="updateBoneRotation()">
            </div>
            <div class="control-group">
                <label>Rotate Y: <span id="val-ry">0°</span></label>
                <input type="range" id="rot-y" min="-120" max="120" value="0" oninput="updateBoneRotation()">
            </div>
            <div class="control-group">
                <label>Rotate Z: <span id="val-rz">0°</span></label>
                <input type="range" id="rot-z" min="-120" max="120" value="0" oninput="updateBoneRotation()">
            </div>
            <div class="grid-2">
                <button onclick="resetCurrentBone()">Reset Joint</button>
                <button onclick="applyPresetPose(document.getElementById('sel-pose').value)">Reset Pose</button>
            </div>
        </div>

        <!-- TAB 3: LIGHTING -->
        <div id="tab-light" class="tab-content">
            <div class="section-title">Studio Preset</div>
            <div class="control-group">
                <select id="sel-light-preset" onchange="applyLightingPreset(this.value)">
                    <option value="studio" selected>3-Point Studio (Default)</option>
                    <option value="daylight">Daylight / Natural Sun</option>
                    <option value="stage">Stage / Dramatic Rim</option>
                </select>
            </div>
            <div class="section-title">Key Light (အဓိကမီး)</div>
            <div class="control-group">
                <label>Orbit Angle:</label>
                <input type="range" id="key-angle" min="0" max="360" value="45" oninput="updateLights()">
            </div>
            <div class="control-group">
                <label>Intensity:</label>
                <input type="range" id="key-intensity" min="0" max="3.5" step="0.1" value="1.5" oninput="updateLights()">
            </div>
            <div class="section-title">Rim Light (အနားသတ်မီး)</div>
            <div class="control-group">
                <label>Intensity:</label>
                <input type="range" id="rim-intensity" min="0" max="4" step="0.1" value="2.2" oninput="updateLights()">
            </div>
            <button class="primary" style="margin-top: 10px; width: 100%;" onclick="resetLights()">Reset Lighting</button>
        </div>

        <!-- TAB 4: DATA -->
        <div id="tab-file" class="tab-content">
            <div class="section-title">ZIP Source</div>
            <p id="zip-error-msg" style="font-size: 11px; color: #f87171; line-height: 1.4; margin-bottom: 8px;"></p>
            <input type="file" id="zip-input" accept=".zip" onchange="onZipFileUploaded(event)" style="width: 100%;">
        </div>
    </div>

    <script>
        let isUIHidden = false;
        function toggleUI() {
            isUIHidden = !isUIHidden;
            const panel = document.getElementById('ui-panel');
            const btn = document.getElementById('ui-toggle-btn');
            if (isUIHidden) {
                panel.classList.add('hidden');
                btn.innerText = "⚙️ Show UI";
            } else {
                panel.classList.remove('hidden');
                btn.innerText = "👁️ Hide UI";
            }
        }

        function switchTab(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(id).classList.add('active');
        }

        const MODEL_MANIFEST = {
            african: {
                female: { adult: "african female_adult.glb", child: "African Female_Child.glb", elderly: "African Female_Elderly.glb", teen: "African Female_Teen.glb", toddler: "African Female_Toddler.glb" },
                male: { adult: "african male_adult.glb", child: "African Male_Child.glb", elderly: "African Male_Elderly.glb", teen: "African Male_Teen.glb", toddler: "African Male_Toddler.glb" }
            },
            asian: {
                female: { adult: "asian female_adult.glb", child: "Asian Female_Child.glb", elderly: "Asian Female_Elderly.glb", teen: "Asian Female_Teen.glb", toddler: "Asian Female_Toddler.glb" },
                male: { adult: "asian male_adult.glb", child: "Asian Male_Child.glb", elderly: "Asian Male_Elderly.glb", teen: "Asian Male_Teen.glb", toddler: "Asian Male_Toddler.glb" }
            },
            caucasian: {
                female: { adult: "caucasian female_adult.glb", child: "Caucasia Female_Child.glb", elderly: "Caucasian Female_Elderly.glb", teen: "Caucasia Female_Teen.glb", toddler: "Caucasian Female_Toddler.glb" },
                male: { adult: "caucasian male_adult.glb", child: "Caucasia Male_Child.glb", elderly: "Caucasian Male_Elderly.glb", teen: "Caucasia Male_Teen.glb", toddler: "Caucasian Male_Toddler.glb" }
            }
        };

        let scene, camera, renderer, controls;
        let characterModel, bones = {}, originalMaterials = new Map();
        let keyLight, fillLight, rimLight, ambientLight;
        let loadedZip = null;
        const gltfLoader = new THREE.GLTFLoader();

        function showLoading(msg) {
            document.getElementById('loading-text').innerText = msg;
            document.getElementById('loading-overlay').style.display = 'flex';
        }
        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0e0e13);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.3, window.innerWidth <= 768 ? 4.3 : 3.8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0.9, 0);
            controls.enableDamping = true;

            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(12, 12),
                new THREE.MeshStandardMaterial({ color: 0x14141c, roughness: 0.88 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            setupLights();
            window.addEventListener('resize', onWindowResize);
            animate();

            tryAutoLoadZip();
        }

        function setupLights() {
            ambientLight = new THREE.AmbientLight(0x22222e, 0.6);
            scene.add(ambientLight);

            keyLight = new THREE.DirectionalLight(0xfff3e3, 1.5);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 1024;
            keyLight.shadow.mapSize.height = 1024;
            scene.add(keyLight);

            fillLight = new THREE.DirectionalLight(0x8eb3ff, 0.45);
            scene.add(fillLight);

            rimLight = new THREE.DirectionalLight(0xffffff, 2.2);
            rimLight.position.set(0, 2.6, -3.0);
            scene.add(rimLight);

            updateLights();
        }

        function updateLights() {
            const angle = THREE.MathUtils.degToRad(parseFloat(document.getElementById('key-angle').value));
            const dist = 3.6;
            keyLight.position.set(Math.cos(angle) * dist, 2.5, Math.sin(angle) * dist);
            keyLight.intensity = parseFloat(document.getElementById('key-intensity').value);
            fillLight.position.set(-Math.cos(angle) * dist, 1.5, -Math.sin(angle) * 0.6 * dist);
            rimLight.intensity = parseFloat(document.getElementById('rim-intensity').value);
        }

        function resetLights() {
            document.getElementById('key-angle').value = 45;
            document.getElementById('key-intensity').value = 1.5;
            document.getElementById('rim-intensity').value = 2.2;
            updateLights();
        }

        function applyLightingPreset(type) {
            if (type === 'studio') resetLights();
            else if (type === 'daylight') {
                keyLight.position.set(2, 5, 2); keyLight.intensity = 2.2; rimLight.intensity = 0.3;
            } else if (type === 'stage') {
                keyLight.intensity = 0.4; rimLight.intensity = 3.5;
            }
        }

        async function tryAutoLoadZip() {
            showLoading("Connecting to models.zip...");
            const candidates = ['models.zip', './models.zip', 'Models.zip', './Models.zip'];
            let foundBlob = null;
            let lastErr = "";

            for (const url of candidates) {
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        foundBlob = await res.blob();
                        break;
                    } else {
                        lastErr = `HTTP ${res.status} on ${url}`;
                    }
                } catch (e) {
                    lastErr = e.message;
                }
            }

            if (foundBlob) {
                loadedZip = await JSZip.loadAsync(foundBlob);
                setZipBadge(true, "models.zip Loaded");
                document.getElementById('zip-error-msg').innerText = "";
                await onModelChange();
            } else {
                setZipBadge(false, "models.zip Not Found");
                document.getElementById('zip-error-msg').innerText = "models.zip ရှာမတွေ့ပါ (" + lastErr + ")။ ကျေးဇူးပြု၍ Data tab မှ ZIP ကို ရွေးပေးပါ။";
                hideLoading();
            }
        }

        async function onZipFileUploaded(e) {
            const file = e.target.files[0];
            if (!file) return;
            showLoading("Extracting " + file.name + "...");
            try {
                loadedZip = await JSZip.loadAsync(file);
                setZipBadge(true, file.name);
                document.getElementById('zip-error-msg').innerText = "";
                await onModelChange();
            } catch (err) {
                alert("ZIP ဖတ်မရပါ: " + err.message);
                hideLoading();
            }
        }

        function setZipBadge(ok, text) {
            const badge = document.getElementById('zip-badge');
            badge.innerText = text;
            badge.className = "status-badge " + (ok ? "ok" : "warn");
        }

        function findEntryInZip(zip, targetName) {
            const cleanTarget = targetName.toLowerCase().replace(/[^a-z0-9]/g, '');
            for (const path in zip.files) {
                if (zip.files[path].dir || path.includes('__MACOSX') || path.startsWith('.')) continue;
                const fileName = path.split('/').pop();
                const cleanName = fileName.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (cleanName === cleanTarget) return zip.files[path];
            }
            return null;
        }

        async function onModelChange() {
            if (!loadedZip) {
                switchTab('tab-file');
                return;
            }
            const ethnic = document.getElementById('sel-ethnic').value;
            const gender = document.getElementById('sel-gender').value;
            const age = document.getElementById('sel-age').value;

            const targetFilename = MODEL_MANIFEST[ethnic]?.[gender]?.[age];
            const zipEntry = findEntryInZip(loadedZip, targetFilename);

            if (!zipEntry) {
                alert("ZIP ထဲတွင် " + targetFilename + " ရှာမတွေ့ပါခင်ဗျာ။");
                return;
            }

            showLoading("Rendering " + targetFilename + "...");
            const arrayBuffer = await zipEntry.async("arraybuffer");

            gltfLoader.parse(arrayBuffer, '', (gltf) => {
                if (characterModel) scene.remove(characterModel);

                characterModel = gltf.scene;
                bones = {};
                originalMaterials.clear();

                const box = new THREE.Box3().setFromObject(characterModel);
                characterModel.position.set(0, -box.min.y, 0);

                let hasSkinnedMesh = false;

                // Deep Inspection of Bones and Skeletons
                characterModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        originalMaterials.set(child, child.material);

                        if (child.isSkinnedMesh) {
                            hasSkinnedMesh = true;
                            if (child.skeleton && child.skeleton.bones) {
                                child.skeleton.bones.forEach(b => {
                                    if (b && b.name) bones[b.name] = b;
                                });
                            }
                        }
                    }
                    if (child.isBone || child.type === 'Bone') {
                        if (child.name) bones[child.name] = child;
                    }
                });

                scene.add(characterModel);

                // Update Rig Diagnostic Box
                const numBones = Object.keys(bones).length;
                const rigStatus = document.getElementById('rig-status-box');
                if (numBones > 0) {
                    rigStatus.innerHTML = `<span style="color:#4ade80;">● Rig Active:</span> <b>${numBones}</b> Bones detected (${hasSkinnedMesh ? 'Skinned' : 'Hierarchical'})`;
                } else {
                    rigStatus.innerHTML = `<span style="color:#f87171;">● No Bones:</span> ဖိုင်ထဲတွင် Skeleton မပါဝင်ပါ (Static Mesh ဖြစ်နေပါသည်)`;
                }

                populateBoneDropdown();
                applyShadingMode(document.getElementById('sel-shading').value);
                applyPresetPose(document.getElementById('sel-pose').value);
                adjustHeight(document.getElementById('height-slider').value);

                hideLoading();
            }, (err) => {
                alert("GLTF Error: " + err);
                hideLoading();
            });
        }

        // CRITICAL FIX: Ensure 'skinning: true' is set so custom materials deform properly with bones!
        function createStudioMaterial(type, isSkinned) {
            if (type === 'clay') {
                return new THREE.MeshStandardMaterial({
                    color: 0xdfd7cb, roughness: 0.72, metalness: 0.0, flatShading: false,
                    skinning: isSkinned
                });
            } else if (type === 'planar') {
                return new THREE.MeshStandardMaterial({
                    color: 0xd6d6e2, roughness: 0.4, metalness: 0.05, flatShading: true,
                    skinning: isSkinned
                });
            } else if (type === 'ecorche') {
                return new THREE.MeshStandardMaterial({
                    color: 0x933030, roughness: 0.45, metalness: 0.08, flatShading: true,
                    skinning: isSkinned
                });
            } else if (type === 'wireframe') {
                return new THREE.MeshBasicMaterial({
                    color: 0x6366f1, wireframe: true,
                    skinning: isSkinned
                });
            }
            return null;
        }

        function applyShadingMode(mode) {
            if (!characterModel) return;
            characterModel.traverse((child) => {
                if (!child.isMesh) return;
                const isSkinned = !!child.isSkinnedMesh;

                if (mode === 'original') {
                    child.material = originalMaterials.get(child);
                } else {
                    child.material = createStudioMaterial(mode, isSkinned);
                }
                child.material.needsUpdate = true;
            });
        }

        function adjustHeight(val) {
            document.getElementById('val-height').innerText = val + '%';
            if (!characterModel) return;
            characterModel.scale.set(1, parseFloat(val) / 100.0, 1);
        }

        function populateBoneDropdown() {
            const select = document.getElementById('sel-bone');
            select.innerHTML = '';
            const boneNames = Object.keys(bones);

            if (boneNames.length === 0) {
                const opt = document.createElement('option');
                opt.innerText = "No Bones Found in File";
                select.appendChild(opt);
                return;
            }

            boneNames.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b;
                opt.innerText = b;
                select.appendChild(opt);
            });
            loadBoneRotations();
        }

        function loadBoneRotations() {
            const name = document.getElementById('sel-bone').value;
            const b = bones[name];
            if (!b) return;
            const rx = Math.round(THREE.MathUtils.radToDeg(b.rotation.x));
            const ry = Math.round(THREE.MathUtils.radToDeg(b.rotation.y));
            const rz = Math.round(THREE.MathUtils.radToDeg(b.rotation.z));
            document.getElementById('rot-x').value = rx;
            document.getElementById('rot-y').value = ry;
            document.getElementById('rot-z').value = rz;
            document.getElementById('val-rx').innerText = rx + '°';
            document.getElementById('val-ry').innerText = ry + '°';
            document.getElementById('val-rz').innerText = rz + '°';
        }

        // Updates Joint and forces Skeleton Matrix transformation
        function updateBoneRotation() {
            const name = document.getElementById('sel-bone').value;
            const b = bones[name];
            if (!b) return;

            const rx = parseFloat(document.getElementById('rot-x').value);
            const ry = parseFloat(document.getElementById('rot-y').value);
            const rz = parseFloat(document.getElementById('rot-z').value);

            b.rotation.x = THREE.MathUtils.degToRad(rx);
            b.rotation.y = THREE.MathUtils.degToRad(ry);
            b.rotation.z = THREE.MathUtils.degToRad(rz);
            b.updateMatrixWorld(true);

            // Force update on all skinned meshes in model
            characterModel.traverse((child) => {
                if (child.isSkinnedMesh && child.skeleton) {
                    child.skeleton.update();
                }
            });

            document.getElementById('val-rx').innerText = rx + '°';
            document.getElementById('val-ry').innerText = ry + '°';
            document.getElementById('val-rz').innerText = rz + '°';
        }

        function resetCurrentBone() {
            document.getElementById('rot-x').value = 0;
            document.getElementById('rot-y').value = 0;
            document.getElementById('rot-z').value = 0;
            updateBoneRotation();
        }

        function findBone(keywords) {
            const names = Object.keys(bones);
            for (const kw of keywords) {
                const match = names.find(n => n.toLowerCase().includes(kw.toLowerCase()));
                if (match) return bones[match];
            }
            return null;
        }

        function setRot(bone, x, y, z) {
            if (!bone) return;
            bone.rotation.x = THREE.MathUtils.degToRad(x);
            bone.rotation.y = THREE.MathUtils.degToRad(y);
            bone.rotation.z = THREE.MathUtils.degToRad(z);
            bone.updateMatrixWorld(true);
        }

        function applyPresetPose(pose) {
            Object.values(bones).forEach(b => b.rotation.set(0,0,0));

            const head = findBone(['head']);
            const spine = findBone(['spine2', 'spine02', 'spine_02', 'chest', 'spine1', 'spine01', 'spine']);
            const pelvis = findBone(['pelvis', 'hips', 'root']);
            const l_arm = findBone(['upperarm_l', 'upperarm01.l', 'upperarm01_l', 'arm_l', 'shoulder_l']);
            const r_arm = findBone(['upperarm_r', 'upperarm01.r', 'upperarm01_r', 'arm_r', 'shoulder_r']);
            const l_forearm = findBone(['lowerarm_l', 'lowerarm01.l', 'forearm_l']);
            const r_forearm = findBone(['lowerarm_r', 'lowerarm01.r', 'forearm_r']);
            const l_thigh = findBone(['thigh_l', 'thigh01.l', 'upleg_l']);
            const r_thigh = findBone(['thigh_r', 'thigh01.r', 'upleg_r']);
            const l_knee = findBone(['calf_l', 'calf01.l', 'knee_l']);
            const r_knee = findBone(['calf_r', 'calf01.r', 'knee_r']);

            if (pose === 'contrapposto') {
                setRot(pelvis, 0, 0, 5); setRot(spine, -2, 5, -7); setRot(head, 3, -12, 4);
                setRot(r_thigh, -5, 0, 2); setRot(l_thigh, 12, -8, -6); setRot(l_knee, -24, 0, 0);
                setRot(r_arm, 10, 0, 12); setRot(r_forearm, -30, 0, 0);
            } else if (pose === 'sitting') {
                setRot(l_thigh, -85, 5, 0); setRot(r_thigh, -85, -5, 0);
                setRot(l_knee, 90, 0, 0); setRot(r_knee, 90, 0, 0); setRot(spine, 8, 0, 0);
            } else if (pose === 'action') {
                setRot(spine, 10, -20, 0); setRot(head, -5, 25, 0);
                setRot(l_arm, -50, 20, 30); setRot(r_arm, 40, 0, -20);
                setRot(r_thigh, -40, 10, 0); setRot(r_knee, 50, 0, 0);
            }

            characterModel.traverse((child) => {
                if (child.isSkinnedMesh && child.skeleton) {
                    child.skeleton.update();
                }
            });
            loadBoneRotations();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
